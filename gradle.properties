group=top.wcpe.taboolib.ioc
version=0.0.8
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true
kotlin.code.style=official
# 本机代理环境对 repo.maven.apache.org 的 TLS 握手会被远端重置，
# 对 plugins.gradle.org 的 303 重定向产物会返回 0 字节；下列 Maven 域名直连全部可用，
# 故绕过代理直连（只影响本机，CI 无代理时该配置为空操作）
systemProp.http.nonProxyHosts=maven.aliyun.com|maven.wcpe.top|repo.maven.apache.org|repo.tabooproject.org|repo.spongepowered.org|s01.oss.sonatype.org|oss.sonatype.org|plugins.gradle.org|plugins-artifacts.gradle.org
