name: CI

on:
  # 纯文档变更（README/CHANGELOG/docs/许可证）跳过整套构建：本工作流会跑
  # `build ciTest` + 发布到隔离 Maven + 编译两个 example，耗时以分钟计，而文档改动
  # 不可能影响其中任何一步。
  #
  # 刻意**不**忽略 `.github/**`：若忽略，改动本工作流自身的 PR 就不会触发任何 CI，
  # 写坏了也无人发现。工作流文件的改动必须照常跑一遍。
  #
  # 注意：GitHub 的必需状态检查是**按 check 名匹配**的，并不存在「把某个路径从必需检查
  # 中排除」的开关。一旦对 `master` 启用分支保护并把本工作流的 job 设为必需，命中
  # paths-ignore 的纯文档 PR 会让本工作流整体不产生任何 check，从而永久卡在
  # "Expected — Waiting for status to be reported"。可落地的做法只有让被要求的 check 名
  # **恒有 job 运行**：
  #   1) 保留一个不带 paths-ignore 的轻量 gate job（例如只跑 checkout + 打印结论），
  #      把它的名字设为必需检查，重活 job 通过 `needs:` 挂在它后面；
  #   2) 或用 `dorny/paths-filter` 在 job 内部过滤变更，让重活 job 以
  #      `if: needs.changes.outputs.docs != 'true'` 的形式跳过（跳过的 job 会汇报为
  #      success，必需检查不会卡住）。
  # 当前 `master` **尚未启用分支保护**（`gh api repos/wcpe/taboolib-ioc-gradle-plugin/branches/master/protection`
  # 返回 404），因此该风险尚未生效；在开启分支保护前先按上面的方式改造。
  #
  # 另外：下列清单里的 `docs/**` 已被 `**/*.md` 完全覆盖（`docs/` 下当前只有 Markdown），
  # 保留它只是为了将来 `docs/` 目录出现非 Markdown 资产时仍能跳过，不代表它是独立规则。
  push:
    paths-ignore: &docs-only
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore: *docs-only
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXAMPLE_LOCAL_MAVEN_REPO: ${{ github.workspace }}/example/.m2-local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle 守护进程与嵌套构建必须跑在 JDK 21+：被测 fixture 经 GradleRunner 嵌套构建，
      # 其依赖 mc-testkit:0.8.0 的 Gradle 模块元数据要求 JVM 21+（Java 17 会在配置期报
      # "Dependency requires at least JVM runtime version 21"）。
      # 插件本体仍用 Java 17 toolchain 编译，故 17 也要装（GH runner 的 /usr/lib/jvm 会被
      # Gradle 自动探测；此处显式装一遍更稳）。后装的 21 成为 JAVA_HOME。
      - name: Set up Java 17 (compile toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Java 21 (Gradle daemon / nested build JVM)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and run all tests
        # `ciTest` 只跑 test + 覆盖率门禁 + 插件集成测试，并不产出构建产物（jar）；
        # 因此额外并入 `build`（= assemble + check）以保证「构建 + 测试」两件事都发生。
        # `build` 的 check 已依赖 jacocoTestCoverageVerification，与 ciTest 的依赖在同一
        # Gradle 调用中会被去重，覆盖率门禁只运行一次，不会重复执行。
        run: ./gradlew build ciTest --no-daemon --stacktrace

      - name: Publish current plugin to isolated Maven local
        run: |
          rm -rf "$EXAMPLE_LOCAL_MAVEN_REPO"
          ./gradlew publishToMavenLocal --no-daemon -Dmaven.repo.local="$EXAMPLE_LOCAL_MAVEN_REPO"

      - name: Build Groovy DSL example
        run: ./gradlew -p example :groovy-consumer:build --no-daemon -Dmaven.repo.local="$EXAMPLE_LOCAL_MAVEN_REPO" --refresh-dependencies

      - name: Build Kotlin DSL example
        run: ./gradlew -p example :kotlin-consumer:build --no-daemon -Dmaven.repo.local="$EXAMPLE_LOCAL_MAVEN_REPO" --refresh-dependencies

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Test Results
          path: '**/build/test-results/test/*.xml'
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/**
            build/test-results/**
            plugin-integration-tests/build/reports/**
            plugin-integration-tests/build/test-results/**
            example/groovy-consumer/build/libs/**
            example/groovy-consumer/build/reports/taboolib-ioc/**
            example/kotlin-consumer/build/libs/**
            example/kotlin-consumer/build/reports/taboolib-ioc/**
          if-no-files-found: ignore
