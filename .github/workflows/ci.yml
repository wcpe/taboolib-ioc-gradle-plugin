name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXAMPLE_LOCAL_MAVEN_REPO: ${{ github.workspace }}/example/.m2-local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle 守护进程与嵌套构建必须跑在 JDK 21+：被测 fixture 经 GradleRunner 嵌套构建，
      # 其依赖 mc-testkit:0.8.0 的 Gradle 模块元数据要求 JVM 21+（Java 17 会在配置期报
      # "Dependency requires at least JVM runtime version 21"）。
      # 插件本体仍用 Java 17 toolchain 编译，故 17 也要装（GH runner 的 /usr/lib/jvm 会被
      # Gradle 自动探测；此处显式装一遍更稳）。后装的 21 成为 JAVA_HOME。
      - name: Set up Java 17 (compile toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Java 21 (Gradle daemon / nested build JVM)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and run all tests
        # `ciTest` 只跑 test + 覆盖率门禁 + 插件集成测试，并不产出构建产物（jar）；
        # 因此额外并入 `build`（= assemble + check）以保证「构建 + 测试」两件事都发生。
        # `build` 的 check 已依赖 jacocoTestCoverageVerification，与 ciTest 的依赖在同一
        # Gradle 调用中会被去重，覆盖率门禁只运行一次，不会重复执行。
        run: ./gradlew build ciTest --no-daemon --stacktrace

      - name: Publish current plugin to isolated Maven local
        run: |
          rm -rf "$EXAMPLE_LOCAL_MAVEN_REPO"
          ./gradlew publishToMavenLocal --no-daemon -Dmaven.repo.local="$EXAMPLE_LOCAL_MAVEN_REPO"

      - name: Build Groovy DSL example
        run: ./gradlew -p example :groovy-consumer:build --no-daemon -Dmaven.repo.local="$EXAMPLE_LOCAL_MAVEN_REPO" --refresh-dependencies

      - name: Build Kotlin DSL example
        run: ./gradlew -p example :kotlin-consumer:build --no-daemon -Dmaven.repo.local="$EXAMPLE_LOCAL_MAVEN_REPO" --refresh-dependencies

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Test Results
          path: '**/build/test-results/test/*.xml'
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/**
            build/test-results/**
            plugin-integration-tests/build/reports/**
            plugin-integration-tests/build/test-results/**
            example/groovy-consumer/build/libs/**
            example/groovy-consumer/build/reports/taboolib-ioc/**
            example/kotlin-consumer/build/libs/**
            example/kotlin-consumer/build/reports/taboolib-ioc/**
          if-no-files-found: ignore
